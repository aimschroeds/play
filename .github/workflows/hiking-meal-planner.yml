name: hiking-meal-planner CI

on:
  push:
    branches: [main]
    paths: ['hiking-meal-planner/**']
  pull_request:
    paths: ['hiking-meal-planner/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hiking-meal-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hiking-meal-planner/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
